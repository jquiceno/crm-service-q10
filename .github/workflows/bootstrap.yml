name: Bootstrap — AWS resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (each maps to a separate AWS account)
        type: choice
        options: [dev, qa, prod]
        required: true
      action:
        description: Terraform action
        type: choice
        options: [plan, apply]
        default: plan

# vars.SERVICE_NAME must be set as a GitHub repository variable (e.g. "announcements-service").
concurrency:
  group: terraform-bootstrap-${{ vars.SERVICE_NAME }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Resolve state bucket
        run: |
          case "${{ inputs.environment }}" in
            # NOTE: qa currently shares the dev account (764283926096).
            # Update this mapping when qa gets its own AWS account.
            dev|qa) TF_STATE_BUCKET="q10-terraform-state-764283926096" ;;
            prod)   TF_STATE_BUCKET="q10-terraform-state-451828143717" ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=services/${{ vars.SERVICE_NAME }}/${{ inputs.environment }}/terraform.tfstate"
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file="env/${{ inputs.environment }}.tfvars" \
            -out=tfplan \
            -detailed-exitcode
          EXIT=$?
          set -e
          if [ $EXIT -eq 1 ]; then exit 1; fi
          echo "has-changes=$([ $EXIT -eq 2 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
        working-directory: terraform

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ vars.SERVICE_NAME }}-${{ inputs.environment }}
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform apply (${{ inputs.environment }})
    needs: plan
    if: inputs.action == 'apply' && needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    # This environment must have required reviewers configured in GitHub so that
    # apply requires manual approval before executing.
    environment: bootstrap
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Resolve state bucket
        run: |
          case "${{ inputs.environment }}" in
            # NOTE: qa currently shares the dev account (764283926096).
            # Update this mapping when qa gets its own AWS account.
            dev|qa) TF_STATE_BUCKET="q10-terraform-state-764283926096" ;;
            prod)   TF_STATE_BUCKET="q10-terraform-state-451828143717" ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=services/${{ vars.SERVICE_NAME }}/${{ inputs.environment }}/terraform.tfstate"
        working-directory: terraform

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ vars.SERVICE_NAME }}-${{ inputs.environment }}
          path: terraform

      - name: Terraform apply
        run: terraform apply tfplan
        working-directory: terraform
