services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.example
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceInfo__Name: ServiceTemplate
      ServiceInfo__Version: 1.0.0
      Sentry__Enabled: "false"
