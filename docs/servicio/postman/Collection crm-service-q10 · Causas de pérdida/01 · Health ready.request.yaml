$kind: http-request
description: Comprueba las dependencias, incluido el resolver de tenants. Un 503 aquí explica de antemano casi cualquier fallo de las peticiones siguientes.
url: "{{baseUrl}}/health/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200 — un 503 significa resolver o Redis caídos', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
