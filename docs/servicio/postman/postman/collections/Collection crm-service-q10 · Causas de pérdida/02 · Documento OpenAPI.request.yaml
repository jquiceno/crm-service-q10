$kind: http-request
description: El documento se sirve bajo el prefijo, igual que todo lo demás.
url: "{{baseUrl}}/openapi/v1.json"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', function () {
          pm.response.to.have.status(200);
      });

      var doc = pm.response.json();

      pm.test('Documenta el listado bajo el prefijo', function () {
          pm.expect(doc.paths).to.have.property('/crm-service/loss-reasons');
      });

      pm.test('El id de ruta lleva descripción', function () {
          var p = doc.paths['/crm-service/loss-reasons/{id}'].get.parameters.find(function (x) {
              return x.in === 'path';
          });
          pm.expect(p.description).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 3000
