# -----------------------------------------------------------------------------
# ConfigMap — non-sensitive application configuration.
# Sensitive values (connection strings, API keys) go in External Secrets.
# Each overlay overrides environment-specific keys.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-service-config
  namespace: crm-service
data:
  # ASP.NET Core
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_PATHBASE: "/crm-service"

  # Service info
  ServiceInfo__Name: "CrmService"
  ServiceInfo__Version: "1.0.0"

  # Tenant resolver service — the URL and encryption key come from the
  # /platform/{env}/shared secret as the language-agnostic variables
  # TENANT_RESOLVER_SERVICE_URL and CONNSTRING_ENCRYPTION_KEY (aliased to
  # TenantResolverService:BaseUrl/:EncryptionKey at startup)
  TenantResolverService__Enabled: "true"
  TenantResolverService__TimeoutSeconds: "15"
  TenantResolverService__CacheTtlMinutes: "10"

  # Cache — L2 (Redis) is mandatory while multitenancy is enabled; the
  # connection string comes from the ExternalSecret (shared secret)
  Cache__L2Enabled: "true"

  # Sentry — the DSN comes from the /platform/{env}/shared secret as the
  # language-agnostic variable SENTRY_DSN (aliased to Sentry:Dsn at startup);
  # the rest of the non-sensitive config lives here
  Sentry__Enabled: "true"
  Sentry__TracesSampleRate: "0.2"
  # Minimum Serilog levels for the Sentry sink (bound by name, case-insensitive):
  # Verbose | Debug | Information | Warning | Error | Fatal
  Sentry__MinimumEventLevel: "Error"
  Sentry__MinimumBreadcrumbLevel: "Warning"
  # Minimum level forwarded to the Logs product. Separate knob from MinimumEventLevel above:
  # that one decides what becomes an Issue, this one what reaches the log stream.
  Sentry__MinimumLogLevel: "Warning"
  # Deployment tier reported to Sentry: dev | qa | prod, lowercase, set per overlay.
  # NOT derived from ASPNETCORE_ENVIRONMENT — that is a runtime mode with two useful values, so
  # qa and prod would both report "Production" and stop being distinguishable in Sentry.
  SENTRY_ENVIRONMENT: "prod"
  Sentry__DeniedHeaders: "Authorization,Proxy-Authorization,Cookie,Set-Cookie,X-Api-Key,X-Forwarded-For,X-Real-Ip,X-Csrf-Token,X-Xsrf-Token"

  # CORS — no default here on purpose: an unset origin fails closed (CORS blocked)
  # instead of silently inheriting another environment's domain. Every overlay
  # (dev/qa/prod) must set Cors__AllowedOrigins__0 explicitly.
