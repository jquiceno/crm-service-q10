apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
  namespace: service-template
  labels:
    app: service-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-template
  template:
    metadata:
      labels:
        app: service-template
    spec:
      containers:
        - name: api
          # Image overridden per overlay via kustomization images:
          image: q10-service-template:latest
          ports:
            - containerPort: 8080
          # Config injection: ConfigMap (non-sensitive) + Secret (sensitive via External Secrets)
          envFrom:
            - configMapRef:
                name: service-template-config
            - secretRef:
                name: service-template-secrets
                optional: true   # prevents crash if secret has not been synced yet
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
