# -----------------------------------------------------------------------------
# ExternalSecret — reads secrets from AWS Secrets Manager and materializes
# them as a Kubernetes Secret. Requires ClusterSecretStore deployed in the
# cluster (see cluster-infra repo, environments/dev/addons/).
#
# Path in Secrets Manager: /platform/{env}/service-template
# Expected secret format (JSON):
#   {
#     "Persistence__ConnectionString": "Server=...;Database=...;User=...;Password=...",
#     "Sentry__Dsn": "https://...@sentry.io/..."
#   }
#
# Overlays patch the path (/platform/dev, /platform/qa, etc.).
# The base key below is overridden by every overlay — it must never be
# applied directly without an overlay.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-template-secrets
  namespace: service-template
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: service-template-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /platform/prod/service-template
