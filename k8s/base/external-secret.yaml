# -----------------------------------------------------------------------------
# ExternalSecret — reads secrets from AWS Secrets Manager and materializes
# them as a Kubernetes Secret. Requires ClusterSecretStore deployed in the
# cluster (see cluster-infra repo, environments/dev/addons/).
#
# Two sources, both extracted verbatim (no key remapping — the app consumes
# the platform's language-agnostic variable names directly):
#
# 1. Service-specific secret — /platform/{env}/service-template
#      {
#        "Sentry__Dsn": "https://...@sentry.io/..."
#      }
#
# 2. Platform shared secret — /platform/{env}/shared
#      {
#        "TENANT_RESOLVER_SERVICE_URL": "http://tenant-resolver-service...",
#        "CONNSTRING_ENCRYPTION_KEY": "<passphrase to decrypt tenant connstrings>",
#        "Cache__ConnectionString": "<redis endpoint>"
#      }
#    TENANT_RESOLVER_SERVICE_URL and CONNSTRING_ENCRYPTION_KEY are aliased to
#    TenantResolverService:BaseUrl / :EncryptionKey at startup (see
#    TenancyConfigurationExtensions.AddTenantResolverEnvironmentAliases).
#
# Overlays patch both extract keys to the matching environment
# (/platform/dev/..., /platform/qa/...). The base keys below point to prod
# and must never be applied directly without an overlay.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-template-secrets
  namespace: service-template
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: service-template-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /platform/prod/service-template
    - extract:
        key: /platform/prod/shared
