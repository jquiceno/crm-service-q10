# -----------------------------------------------------------------------------
# ExternalSecret — reads secrets from AWS Secrets Manager and materializes
# them as a Kubernetes Secret. Requires ClusterSecretStore deployed in the
# cluster (see cluster-infra repo, environments/dev/addons/).
#
# Two sources:
#
# 1. Service-specific secret — /platform/{env}/service-template
#    Extracted verbatim (dataFrom). Expected format (JSON):
#      {
#        "Sentry__Dsn": "https://...@sentry.io/..."
#      }
#
# 2. Platform shared secret — /platform/{env}/shared
#    Language-agnostic key names, remapped per service (data entries below):
#      TENANT_RESOLVER_URL       -> TenantResolverService__BaseUrl
#      CONNSTRING_ENCRYPTION_KEY -> TenantResolverService__EncryptionKey
#      Cache__ConnectionString   -> Cache__ConnectionString
#
# Overlays patch every Secrets Manager key to the matching environment
# (/platform/dev/..., /platform/qa/...). The base keys below point to prod
# and must never be applied directly without an overlay.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-template-secrets
  namespace: service-template
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: service-template-secrets
    creationPolicy: Owner
  data:
    - secretKey: TenantResolverService__BaseUrl
      remoteRef:
        key: /platform/prod/shared
        property: TENANT_RESOLVER_URL
    - secretKey: TenantResolverService__EncryptionKey
      remoteRef:
        key: /platform/prod/shared
        property: CONNSTRING_ENCRYPTION_KEY
    - secretKey: Cache__ConnectionString
      remoteRef:
        key: /platform/prod/shared
        property: Cache__ConnectionString
  dataFrom:
    - extract:
        key: /platform/prod/service-template
