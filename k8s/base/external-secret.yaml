# -----------------------------------------------------------------------------
# ExternalSecret — reads secrets from AWS Secrets Manager and materializes
# them as a Kubernetes Secret. Requires ClusterSecretStore deployed in the
# cluster (see cluster-infra repo, environments/dev/addons/).
#
# Two sources, both extracted verbatim (no key remapping — the app consumes
# the platform's language-agnostic variable names directly):
#
# Overlays patch the path (/platform/dev, /platform/qa, etc.).
# The base key below is overridden by every overlay — it must never be
# applied directly without an overlay.
#
# IMPORTANT: extract.key must match the real Secrets Manager secret name
# EXACTLY, leading slash included. Some legacy secrets exist WITHOUT the
# leading slash — verify the actual name before editing the overlays.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-template-secrets
  namespace: service-template
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: service-template-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /platform/prod/service-template
    - extract:
        key: /platform/prod/shared
