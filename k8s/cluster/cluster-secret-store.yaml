# -----------------------------------------------------------------------------
# ClusterSecretStore — applied ONCE per cluster by the platform team.
# This is NOT the responsibility of individual services.
# The authoritative source lives in cluster-infra repo.
# This file is kept here as reference only.
#
# Requires External Secrets Operator installed and IRSA configured in:
#   environments/dev/addons/ (cluster-infra repo)
#
# Apply with:
#   kubectl apply -f k8s/cluster/cluster-secret-store.yaml
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
