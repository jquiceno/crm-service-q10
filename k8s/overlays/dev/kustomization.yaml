apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# FORK CHECKLIST — when creating a new service from this template, update:
#   1. namespace: below                     (service name)
#   2. images.name / newName               (ECR image key and URI)
#   3. All patch target `name:` values     (ConfigMap, Deployment, Ingress, etc.)
#   4. ASPNETCORE_PATHBASE                 (URL prefix for this service)
#   5. ExternalSecret key paths            (/platform/dev/<service>)
#      IMPORTANT: the extract.key must match the REAL Secrets Manager secret
#      name EXACTLY, leading slash included. Some legacy secrets were created
#      WITHOUT the leading slash (e.g. platform/dev/announcements-service) —
#      check with `aws secretsmanager list-secrets` before assuming the format.
#   6. GitHub repo variables:
#        SERVICE_NAME = <service-name>
#        IMAGE_KEY    = q10-<service-name>
#        IMAGE_NAME   = <account>.dkr.ecr.<region>.amazonaws.com/q10-<service-name>
#   7. terraform/env/*.tfvars              (service_name, github_repo)
#
#   NOTE: shared keys (connstring encrypt key, tenant-resolver URL, redis) do
#   NOT go in this service's own secret — they come from the cluster-managed
#   `platform-shared` secret (see docs/plantilla/variables-entorno.md).
# ---------------------------------------------------------------------------

namespace: crm-service

resources:
  - ../../base

# `name` must match the base deployment image AND vars.IMAGE_KEY GitHub repo variable.
# The CD pipeline runs: kustomize edit set image <IMAGE_KEY>="<ECR_URI>:<TAG>"
images:
  - name: q10-crm-service
    newName: 764283926096.dkr.ecr.us-east-1.amazonaws.com/q10-crm-service
    newTag: dev-latest   # overridden in CD with the commit SHA

patches:
  # --- ConfigMap: dev-specific values ---
  - target:
      kind: ConfigMap
      name: crm-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: crm-service-config
        namespace: crm-service
      data:
        ASPNETCORE_ENVIRONMENT: "Development"
        ASPNETCORE_PATHBASE: "/crm-service"   # URL prefix — must match ingress path
        TenantResolverService__Enabled: "true"
        Sentry__Enabled: "false"
        # Deployment tier, lowercase, same literal every service reports regardless of stack.
        # Set even with Sentry off here, so enabling it never reports the wrong environment.
        SENTRY_ENVIRONMENT: "dev"
        Cors__AllowedOrigins__0: "http://localhost:3000"

  # --- ExternalSecret: Secrets Manager paths for dev ---
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: /platform/dev/crm-service
      - op: replace
        path: /spec/dataFrom/1/extract/key
        value: /platform/dev/shared
    target:
      kind: ExternalSecret
      name: crm-service-secrets

  # --- Deployment: 1 replica in dev to reduce cost ---
  - target:
      kind: Deployment
      name: crm-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crm-service
        namespace: crm-service
      spec:
        replicas: 1

  # --- Ingress: dev Internal ALB group (HTTP:80, inherited from base) ---
  - target:
      kind: Ingress
      name: crm-service-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: crm-service-ingress
        namespace: crm-service
        annotations:
          alb.ingress.kubernetes.io/group.name: q10-dev-internal

  # --- HPA: reduced range in dev ---
  - target:
      kind: HorizontalPodAutoscaler
      name: crm-service
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: crm-service
        namespace: crm-service
      spec:
        minReplicas: 1
        maxReplicas: 3
