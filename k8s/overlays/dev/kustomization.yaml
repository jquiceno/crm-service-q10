apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# FORK CHECKLIST — when creating a new service from this template, update:
#   1. namespace: below                     (service name)
#   2. images.name / newName               (ECR image key and URI)
#   3. All patch target `name:` values     (ConfigMap, Deployment, Ingress, etc.)
#   4. ASPNETCORE_PATHBASE                 (URL prefix for this service)
#   5. ExternalSecret key paths            (/platform/dev/<service>)
#   6. GitHub repo variables:
#        SERVICE_NAME = <service-name>
#        IMAGE_KEY    = q10-<service-name>
#        IMAGE_NAME   = <account>.dkr.ecr.<region>.amazonaws.com/q10-<service-name>
#   7. terraform/env/*.tfvars              (service_name, github_repo)
# ---------------------------------------------------------------------------

namespace: service-template

resources:
  - ../../base

# `name` must match the base deployment image AND vars.IMAGE_KEY GitHub repo variable.
# The CD pipeline runs: kustomize edit set image <IMAGE_KEY>="<ECR_URI>:<TAG>"
images:
  - name: q10-service-template
    newName: 764283926096.dkr.ecr.us-east-1.amazonaws.com/q10-service-template
    newTag: dev-latest   # overridden in CD with the commit SHA

patches:
  # --- ConfigMap: dev-specific values ---
  - target:
      kind: ConfigMap
      name: service-template-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: service-template-config
        namespace: service-template
      data:
        ASPNETCORE_ENVIRONMENT: "Development"
        ASPNETCORE_PATHBASE: "/service-template"   # URL prefix — must match ingress path
        TenantResolverService__Enabled: "false"
        Sentry__Enabled: "false"
        Cors__AllowedOrigins__0: "http://localhost:3000"

  # --- ExternalSecret: Secrets Manager path for dev ---
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: /platform/dev/service-template
    target:
      kind: ExternalSecret
      name: service-template-secrets

  # --- Deployment: 1 replica in dev to reduce cost ---
  - target:
      kind: Deployment
      name: service-template
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service-template
        namespace: service-template
      spec:
        replicas: 1

  # --- Ingress: dev Internal ALB group (HTTP:80, inherited from base) ---
  - target:
      kind: Ingress
      name: service-template-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: service-template-ingress
        namespace: service-template
        annotations:
          alb.ingress.kubernetes.io/group.name: q10-dev-internal

  # --- HPA: reduced range in dev ---
  - target:
      kind: HorizontalPodAutoscaler
      name: service-template
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: service-template
        namespace: service-template
      spec:
        minReplicas: 1
        maxReplicas: 3
