apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-template

resources:
  - ../../base

images:
  - name: q10-service-template
    newName: 764283926096.dkr.ecr.us-east-1.amazonaws.com/q10-service-template
    newTag: qa-latest   # overridden in CD with the commit SHA

patches:
  # --- ConfigMap: qa-specific values ---
  - target:
      kind: ConfigMap
      name: service-template-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: service-template-config
        namespace: service-template
      data:
        ASPNETCORE_ENVIRONMENT: "Staging"
        ASPNETCORE_PATHBASE: "/service-template"   # URL prefix — must match ingress path
        Sentry__Enabled: "true"
        Cors__AllowedOrigins__0: "https://qa.app.q10.com"

  # --- ExternalSecret: Secrets Manager paths for qa ---
  - patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: /platform/qa/service-template
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /platform/qa/shared
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: /platform/qa/shared
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: /platform/qa/shared
    target:
      kind: ExternalSecret
      name: service-template-secrets

  # --- Deployment: 2 replicas in qa ---
  - target:
      kind: Deployment
      name: service-template
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service-template
        namespace: service-template
      spec:
        replicas: 2

  # --- Ingress: qa Internal ALB group + HTTPS ---
  - target:
      kind: Ingress
      name: service-template-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: service-template-ingress
        namespace: service-template
        annotations:
          alb.ingress.kubernetes.io/group.name: q10-qa-internal
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
          alb.ingress.kubernetes.io/certificate-arn: "" # TODO: set ACM cert ARN for qa

  # --- HPA: moderate range in qa ---
  - target:
      kind: HorizontalPodAutoscaler
      name: service-template
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: service-template
        namespace: service-template
      spec:
        minReplicas: 2
        maxReplicas: 6
